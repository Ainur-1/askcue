      const question = 'Как ограничить число запросов, если сервис работает на нескольких серверах?';

      ];
      const answers = {

            else if(action==='transcript') app.transcript=!app.transcript;
            else if(action==='translation') app.translation=!app.translation;
            else if(action==='pause') app.listening=!app.listening;
            else if(action==='navigation') app.nav=!app.nav;
            else if(action==='capture'||action==='capture-area') {app.attachment=true; app.toast=action==='capture'?'Скриншот добавлен в контекст.':'Фрагмент экрана добавлен в контекст.';}
            else if(action==='remove-attachment') app.attachment=false;
            else if(action==='send') {const text=app.el.querySelector('[data-prompt]')?.value.trim(); if(!text){app.toast='Введите вопрос или добавьте фрагмент разговора.';}else{app.tool='voice';app.voice=false;app.toast='Вопрос добавлен в диалог.';}}
            else if(action==='start') {app.screen='session';app.listening=true;app.tool='answer';}
            else if(action==='finish') {app.screen='history';app.listening=false;app.toast='Сессия сохранена во встречах.';}
            else if(action==='settings'||action==='audio-settings') {app.screen='settings';app.settings=action==='audio-settings'?'audio':'general';}
            else if(action==='history') app.screen='history';
            else if(action==='shorten') {app.toast='Короткий вариант: общий счётчик в Redis, атомарная проверка и явная политика при сбоях.';}
            else if(action==='rephrase') {app.toast='Можно сказать иначе: вынесу состояние лимита за пределы отдельных серверов.';}
            else if(action==='copy') app.toast='Ответ выбран для копирования.';
            else if(action==='calendar') app.toast='Календарь подключается к списку предстоящих встреч.';
            else if(action==='export') app.toast='Форматы экспорта: PDF, Markdown, текст.';
            else if(action==='email') app.toast='Письмо составляется по итогам выбранной встречи.';
            else if(action==='prepare') {app.screen='session';app.tool='followup';}
            else if(action==='import') app.toast='Можно добавить резюме, вакансию или документ.';
            else if(action==='reindex') app.toast='Документ выбран для повторной индексации.';
            else if(action==='edit-profile') app.toast='Профиль: опыт, навыки, проекты и образование.';
            else if(action==='provider') app.toast='Подключения: адрес сервера, API-ключ и доступные модели.';
            else if(action==='instructions') app.toast='Свои инструкции: роль, стиль и контекст собеседования.';
            else if(action==='translation-model') app.toast='Модель перевода настраивается отдельно от ответов.';
            else if(action==='shortcut') app.toast='Сочетание клавиш можно переназначить.';
            else if(action==='test-audio') app.toast='Здесь проверяются системный звук и микрофон.';
          }
          render(app);persist();
        });
        if(globalThis.Tweak) {
          const tweak=new Tweak({container:app.el,onChange:()=>render(app)});
          tweak.addSlider(app,'radius',{label:'Скругление',min:4,max:20,step:2,unit:'px',reference:'--pk-radius'});
          tweak.addSlider(app,'font',{label:'Размер текста',min:13,max:17,step:1,unit:'px',reference:'--pk-font'});
          tweak.addSlider(app,'spacing',{label:'Воздух между блоками',min:16,max:32,step:2,unit:'px',reference:'--pk-space'});
          tweak.addSelect(app,'theme',{label:'Тема',options:[{label:'Как в чате',value:'system'},{label:'Светлая',value:'light'},{label:'Тёмная',value:'dark'}]});
          tweak.addColorPicker(app,'accent',{label:'Акцент',reference:'--pk-accent'});
          if(app.compact) tweak.addToggle(app,'transcript',{label:'Показывать разговор'});
        }
      }
    })();
  </script>
</div>
