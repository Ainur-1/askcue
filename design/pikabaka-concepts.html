        const nav=app.el.querySelector('[data-focus-nav]');nav.hidden=!app.nav||(!app.compact&&!inCall);nav.innerHTML=[['session',app.active?'Текущий разговор':'Новый разговор'],['history','История встреч'],['materials','Материалы'],['settings','Настройки']].map(([screen,label])=>`<button type="button" class="pk-nav cursor-interaction" data-screen="${screen}">${label}</button>`).join('');

        let content='';
        if(['profile-edit','job-edit','provider-edit','document','import','confirm','shortcut','instructions','translation','copy','export','email'].includes(app.screen)&&!app.draft){app.screen='session';return render(app);}

        app.el.querySelector('[data-content]').innerHTML=content+`${app.error?`<p class="pk-error" role="alert">${esc(app.error)}</p>`:''}<div class="pk-toast" role="status" aria-live="polite">${esc(app.toast)}</div>`;
        if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});

      const renderAll=()=>apps.forEach(render);
      const blankProfile=()=>({identity:{name:'',email:'',phone:'',location:'',linkedin:'',github:''},totalExperienceYears:0,skills:[],experience:[],projects:[],education:[]});

      const summaryText=app=>{const value=app.answerOverride||answers[app.tool]||answers.answer;return value.lead+'\n\n'+value.points.join('\n');};
      function requestCopy(app,text){open(app,'copy',{text});}
      async function clipboard(app,text){
        try{if(!navigator.clipboard?.writeText)throw new Error('Unavailable');await navigator.clipboard.writeText(text);app.toast='Скопировано';}
        catch{let area=app.el.querySelector('[data-copy-text]');if(!area){requestCopy(app,text);render(app);area=app.el.querySelector('[data-copy-text]');}area.focus();area.select();app.toast='Текст выделен. Нажмите Ctrl+C.';}

      function askConfirm(app,operation,id,title,description){open(app,'confirm',{operation,id,title,description});}
      function saveForm(app){
        if(!formValid(app))return;
        const draft=app.draft;
        if(app.screen==='profile-edit'){
          const p=clone(draft);p.skills=Array.isArray(p.skills)?p.skills:list(p.skills);p.totalExperienceYears=Math.max(0,Number(p.totalExperienceYears)||0);
          p.experience.forEach(row=>row.highlights=Array.isArray(row.highlights)?row.highlights:lines(row.highlights));p.projects.forEach(row=>{row.technologies=Array.isArray(row.technologies)?row.technologies:list(row.technologies);row.highlights=Array.isArray(row.highlights)?row.highlights:lines(row.highlights);});
          data.profile=p;if(app.pendingResumeName){data.resumeName=app.pendingResumeName;app.pendingResumeName=null;}data.profileEnabled=true;app.screen='materials';app.material='profile';app.draft=null;app.stack=[];
        }else if(app.screen==='job-edit'){
          const job={...clone(draft),id:draft.id||++nextId,technologies:Array.isArray(draft.technologies)?draft.technologies:list(draft.technologies),requirements:Array.isArray(draft.requirements)?draft.requirements:lines(draft.requirements)};
          const index=data.jobs.findIndex(item=>item.id===job.id);if(index<0)data.jobs.push(job);else data.jobs[index]=job;if(!data.activeJob)data.activeJob=job.id;app.screen='materials';app.material='jobs';app.draft=null;app.stack=[];
        }else if(app.screen==='document'){
          const doc=data.documents.find(item=>item.id===app.document);Object.assign(doc,{name:draft.name,text:draft.text,indexed:false});close(app);
        }else if(app.screen==='provider-edit'){
          const provider={...clone(draft),id:draft.id||++nextId,enabled:draft.enabled!==false};const index=data.providers.findIndex(item=>item.id===provider.id);if(index<0)data.providers.push(provider);else data.providers[index]=provider;close(app);
        }else if(app.screen==='instructions'){if(draft.rename)currentMeeting(app).name=draft.instructions;else data.settings.instructions=draft.instructions;close(app);}
        else if(app.screen==='translation'){Object.assign(data.settings,draft);close(app);}
        else if(app.screen==='shortcut'){
          const collision=data.shortcuts.find(([key,,combo])=>key!==draft.key&&draft.combo&&combo===draft.combo);if(collision){app.error='Это сочетание уже назначено: '+collision[1];return;}

        app.dirty=false;app.toast='Сохранено';

      function navigate(app,screen){
        if(app.dirty&&['profile-edit','job-edit','provider-edit','document','instructions','translation','shortcut'].includes(app.screen)){open(app,'confirm',{operation:'discard',destination:screen,title:'Не сохранять изменения?',description:'Введённые изменения будут потеряны.'});return;}

      function handle(app,action){
        const [name,rawId,extra]=action.split(':');const id=Number(rawId);
        app.error='';app.toast='';
        if(name==='back'||name==='cancel'){if(app.screen==='profile-edit')app.pendingResumeName=null;close(app);return;}
        if(name==='save-form'){saveForm(app);return;}
        if(name==='start'){
          app.screen='session';app.nav=false;app.draft=null;app.stack=[];
          if(!app.active){app.active=true;app.listening=true;app.startedAt=Date.now();app.endedAt=null;app.prompt='';app.attachment=null;app.tool='answer';app.answerOverride=null;app.messages=[];app.tools=false;app.audioState='receiving';}return;
        }
        if(name==='return-session'){app.screen='session';app.nav=false;app.draft=null;app.stack=[];return;}
        if(name==='finish'&&app.active){
          app.endedAt=Date.now();data.meetings.unshift({id:++nextId,name:activeJob()?.title||'Разговор',date:'Сегодня, '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),duration:formatElapsed(elapsed(app)),note:app.messages.find(m=>m.role==='user')?.text||'Сохранённый разговор',notes:'',summary:summaryText(app),turns:clone(turns),messages:clone(app.messages)});
          app.active=false;app.listening=false;app.screen='history';app.nav=false;app.stack=[];return;
        }
        if(name==='pause'&&app.active){app.listening=!app.listening;return;}
        if(name==='navigation'){app.nav=!app.nav;return;}
        if(name==='more'){app.tools=!app.tools;return;}
        if(name==='transcript'){app.transcript=!app.transcript;return;}
        if(name==='translation'){app.translation=!app.translation;return;}
        if(name==='negotiation-live'){app.tool='negotiation';app.answerOverride=null;return;}
        if(answers[name]&&name!=='voice'&&name!=='negotiation'){
          app.tool=name;app.answerOverride=null;if(!app.active){app.screen='prep';return;}app.messages.push({role:'assistant',text:summaryText(app)});return;
        }
        if(name==='shorten'){app.answerOverride={label:'Короткий ответ',lead:'Общий счётчик в Redis, атомарная проверка лимита и явная политика при сбоях.',points:[]};return;}
        if(name==='rephrase'){app.answerOverride={label:'Другой вариант',lead:'Вынесу состояние лимита за пределы отдельных серверов.',points:['Все серверы проверяют одну квоту.','Проверка и списание выполняются атомарно.','При исчерпании квоты клиент получает 429 и время повторного запроса.']};return;}
        if(name==='copy'){requestCopy(app,summaryText(app));return;}
        if(name==='copy-text'){clipboard(app,app.draft.text);return;}
        if(name==='send'){
          if(!app.prompt.trim()&&!app.attachment){app.error='Введите вопрос или добавьте снимок.';return;}
          const prompt=app.prompt.trim()||'Разбери прикреплённый снимок';app.messages.push({role:'user',text:prompt+(app.attachment?' ['+app.attachment.name+']':'')});
          app.answerOverride={label:'Ответ на ваш вопрос',lead:'По вопросу «'+prompt+'» сначала уточню ограничения, затем предложу решение.',points:app.attachment?['На снимке показан ответ 429: лимит запросов исчерпан.','Проверьте Retry-After и стратегию повторных запросов.']:clone(answers.voice.points)};app.messages.push({role:'assistant',text:summaryText(app)});app.prompt='';app.attachment=null;return;
        }
        if(name==='capture'||name==='capture-area'){app.captureArea=name==='capture-area';app.selection=null;open(app,'capture');return;}
        if(name==='attach-capture'){const attachment={name:app.captureArea?'Область экрана':'Скриншот',selection:clone(app.selection)};close(app);app.attachment=attachment;return;}
        if(name==='remove-attachment'){app.attachment=null;return;}
        if(name==='voice'){app.voiceRecording=false;open(app,'voice',{text:''});return;}
        if(name==='voice-record'){app.voiceRecording=!app.voiceRecording;if(!app.voiceRecording)app.draft.text='Как объяснить компромисс между точностью лимита и доступностью сервиса?';return;}
        if(name==='apply-voice'){if(!app.draft.text.trim()){app.error='Запишите пример или введите вопрос.';return;}const text=app.draft.text;close(app);app.prompt=text;return;}
        if(name==='history'){navigate(app,'history');return;}
        if(name==='choose-job'||name==='open-jobs'){navigate(app,'materials');app.material='jobs';return;}
        if(name==='audio-settings'){navigate(app,'settings');app.settings='audio';return;}
        if(name==='open-shortcuts'){navigate(app,'settings');app.settings='shortcuts';return;}
        if(name==='edit-profile'){open(app,'profile-edit',data.profile);return;}
        if(name==='add-row'){const key=rawId;const row=key==='experience'?{company:'',role:'',startDate:'',endDate:'',highlights:[]}:key==='projects'?{name:'',description:'',technologies:[],highlights:[]}:{institution:'',degree:'',year:''};app.draft[key].push(row);app.dirty=true;return;}
        if(name==='remove-row'){app.draft[rawId].splice(Number(extra),1);app.dirty=true;return;}
        if(name==='delete-profile'){askConfirm(app,'profile',null,'Удалить профиль?','Резюме и данные профиля будут удалены из макета.');return;}
        if(name==='activate-job'){data.activeJob=id;app.job=id;return;}
        if(name==='choose-no-job'){data.activeJob=null;return;}
        if(name==='edit-job'){app.job=id;open(app,'job-edit',data.jobs.find(job=>job.id===id));return;}
        if(name==='delete-job'){askConfirm(app,'job',id,'Удалить вакансию?',data.jobs.find(job=>job.id===id)?.title);return;}
        if(name==='prepare'||name==='negotiation'||name==='company'){app.job=id||data.activeJob;open(app,name==='prepare'?'prep':name);app.category='Все';app.negotiationPhase=0;return;}
        if(name==='refresh-prep'){app.category='Все';app.toast='Подготовка обновлена по текущему профилю и вакансии.';return;}
        if(name==='next-phase'){app.negotiationPhase=(app.negotiationPhase+1)%negotiationPhases.length;return;}
        if(name==='copy-negotiation'){requestCopy(app,negotiationPhases[app.negotiationPhase].line);return;}
        if(name==='import-continue'){
          if(!formValid(app))return;
          const imported=clone(app.draft);
          if(imported.kind==='resume'){app.pendingResumeName=imported.name;open(app,'profile-edit',data.profile||blankProfile());}
          else if(imported.kind==='job')open(app,'job-edit',{...blankJob(),title:imported.name.replace(/\.[^.]+$/,''),description:imported.text});
          else{data.documents.push({id:++nextId,name:imported.name,text:imported.text,indexed:false,enabled:false});app.screen='materials';app.material='documents';app.stack=[];app.draft=null;}
          return;
        }
        if(name==='import'||['import-resume','import-job','import-document'].includes(name)){const kind=name==='import-resume'?'resume':name==='import-job'?'job':name==='import-document'?'document':app.material==='profile'?'resume':app.material==='jobs'?'job':'document';open(app,'import',{kind,name:'',text:''});return;}
        if(name==='document'){app.document=id;open(app,'document',data.documents.find(doc=>doc.id===id));return;}
        if(name==='reindex'){const doc=data.documents.find(item=>item.id===id);if(doc){doc.indexed=true;doc.enabled=true;app.toast='Индекс документа обновлён в макете.';}return;}
        if(name==='delete-document'){askConfirm(app,'document',id,'Удалить документ?',data.documents.find(doc=>doc.id===id)?.name);return;}
        if(name==='provider'){open(app,'providers');return;}
        if(name==='add-provider'){app.connectionCheck='';open(app,'provider-edit',{name:'',base:'https://',key:'',model:'',enabled:true});return;}
        if(name==='edit-provider'){app.provider=id;app.connectionCheck='';open(app,'provider-edit',data.providers.find(item=>item.id===id));return;}
        if(name==='delete-provider'){askConfirm(app,'provider',id,'Удалить подключение?',data.providers.find(item=>item.id===id)?.name);return;}
        if(name==='test-provider'){if(!formValid(app))return;app.connectionCheck=app.draft.base.includes('localhost')?'Локальный адрес и модель заполнены. Для реальной проверки приложение запросит список моделей.':'Адрес API и модель заполнены. Сетевой запрос в макете не выполняется.';return;}
        if(name==='instructions'){open(app,'instructions',{instructions:data.settings.instructions});return;}
        if(name==='translation-model'){open(app,'translation',Object.fromEntries(Object.entries(data.settings).filter(([key])=>key.startsWith('translation'))));return;}
        if(name==='shortcut'){const shortcut=data.shortcuts.find(([key])=>key===rawId);open(app,'shortcut',{key:shortcut[0],label:shortcut[1],combo:shortcut[2]});return;}
        if(name==='clear-shortcut'){app.draft.combo='';app.dirty=true;return;}
        if(name==='reset-shortcuts'){data.shortcuts=clone(defaultShortcuts);return;}
        if(name==='test-audio'){open(app,'audio-test');return;}
        if(name==='diagnostics'){open(app,'diagnostics');return;}
        if(name==='copy-diagnostics'){requestCopy(app,app.el.querySelector('[data-diagnostics]').textContent);return;}
        if(name==='calendar'){open(app,'calendar');return;}
        if(name==='save-notes'){const m=currentMeeting(app);m.notes=app.notesDraft?.id===m.id?app.notesDraft.text:m.notes;app.savedNotes=true;return;}
        if(name==='meeting-recap'){const m=currentMeeting(app);m.summary='Итоги: '+m.turns.map(turn=>turn[2]).join(' ').slice(0,500);return;}
        if(name==='rename-meeting'){open(app,'instructions',{instructions:currentMeeting(app).name,rename:true});return;}
        if(name==='delete-meeting'){askConfirm(app,'meeting',currentMeeting(app).id,'Удалить встречу?',currentMeeting(app).name);return;}
        if(name==='export'){open(app,'export',{format:'Markdown'});return;}
        if(name==='copy-export'){requestCopy(app,exportText(currentMeeting(app),app.draft.format));return;}
        if(name==='download-export'){const m=currentMeeting(app);const format=app.draft.format;const blob=new Blob([exportText(m,format)],{type:format==='JSON'?'application/json':'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='meeting.'+(format==='Markdown'?'md':format==='JSON'?'json':'txt');a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);return;}
        if(name==='print-export'){globalThis.print();return;}
        if(name==='email'){const m=currentMeeting(app);open(app,'email',{recipient:'',subject:'Итоги встречи: '+m.name,body:'Здравствуйте!\n\nСпасибо за разговор. '+m.summary+'\n\nБуду рад обсудить следующие шаги.\n\nС уважением,\n'+(data.profile?.identity.name||'')});return;}
        if(name==='refresh-email'){app.draft.body='Здравствуйте!\n\nБлагодарю за встречу. Мы обсудили: '+currentMeeting(app).summary+'\n\nПодскажите, пожалуйста, какие следующие шаги?\n\n'+(data.profile?.identity.name||'');return;}
        if(name==='copy-email'){requestCopy(app,'Тема: '+app.draft.subject+'\n\n'+app.draft.body);return;}
        if(name==='confirm'){
          const target=app.draft;
          if(target.operation==='discard'){app.stack=[];app.draft=null;app.screen=target.destination;app.dirty=false;return;}
          if(target.operation==='profile'){data.profile=null;data.resumeName='';data.profileEnabled=false;}
          if(target.operation==='job'){data.jobs=data.jobs.filter(item=>item.id!==target.id);if(data.activeJob===target.id)data.activeJob=data.jobs[0]?.id||null;}
          if(target.operation==='document')data.documents=data.documents.filter(item=>item.id!==target.id);
          if(target.operation==='provider')data.providers=data.providers.filter(item=>item.id!==target.id);
          if(target.operation==='meeting'){data.meetings=data.meetings.filter(item=>item.id!==target.id);app.screen='history';app.stack=[];app.draft=null;return;}
          close(app);return;
        }
        throw new Error('Unhandled prototype action: '+action);
      }
      for(const app of apps){
        app.el.addEventListener('input',event=>{
          const node=event.target;
          if(node.matches('[data-field]')&&app.draft){pathSet(app.draft,node.dataset.field,node.type==='number'?Number(node.value):node.value);app.dirty=true;}
          if(node.matches('[data-prompt]'))app.prompt=node.value;
          if(node.matches('[data-search]')){app.search=node.value;app.el.querySelector('[data-meetings]').innerHTML=meetingRows(app);if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
          if(node.matches('[data-notes]')){app.notesDraft={id:currentMeeting(app).id,text:node.value};app.savedNotes=false;const save=app.el.querySelector('[data-action="save-notes"]');if(save)save.innerHTML=icon('check')+'Сохранить заметки';}
          if(node.matches('[data-config]')){data.settings[node.dataset.config]=node.type==='range'?Number(node.value):node.type==='checkbox'?node.checked:node.value;if(node.dataset.config==='opacity'){const output=app.el.querySelector('[data-opacity-value]');if(output)output.textContent=node.value+'%';}}
        });
        app.el.addEventListener('change',async event=>{
          const node=event.target;
          if(node.matches('[data-visibility-mode]')){data.undetectable=node.checked;renderAll();return;}
          if(node.matches('[data-model]')){data.settings.answerModel=node.value;apps.forEach(variant=>variant.model=node.value);}
          if(node.matches('[data-theme]'))app.theme=node.value;
          if(node.matches('[data-config]')){data.settings[node.dataset.config]=node.type==='checkbox'?node.checked:node.type==='range'?Number(node.value):node.value;if(node.dataset.config==='answerModel')apps.forEach(variant=>variant.model=node.value);if(node.dataset.config==='showTranscript')apps.forEach(variant=>variant.transcript=node.checked);if(node.dataset.config==='translation')apps.forEach(variant=>variant.translation=node.checked);}
          if(node.matches('[data-profile-enabled]'))data.profileEnabled=node.checked;
          if(node.matches('[data-document-enabled]')){const doc=data.documents.find(item=>item.id===Number(node.dataset.documentEnabled));if(node.checked&&!doc.indexed){doc.indexed=true;}doc.enabled=node.checked;}
          if(node.matches('[data-provider-enabled]'))data.providers.find(item=>item.id===Number(node.dataset.providerEnabled)).enabled=node.checked;
          if(node.matches('[data-audio-scenario]'))app.audioState=node.value;
          if(node.matches('[data-field]')&&app.draft){pathSet(app.draft,node.dataset.field,node.value);app.dirty=true;}
          if(node.matches('[data-import-file]')){
            const file=node.files?.[0];if(!file)return;app.draft.name=file.name;
            if(/\.(txt|md|json)$/i.test(file.name)){if(file.size>500000){app.error='Для предпросмотра выберите текстовый файл меньше 500 КБ.';}else app.draft.text=await file.text();}
          }
          renderAll();persist();
        });
        app.el.addEventListener('click',event=>{
          const node=event.target.closest('button');if(!node||node.disabled)return;
          if(node.dataset.screen){navigate(app,node.dataset.screen);}
          else if(node.dataset.material){app.material=node.dataset.material;app.error='';app.toast='';}
          else if(node.dataset.settings){app.settings=node.dataset.settings;app.error='';app.toast='';}
          else if(node.dataset.record){app.record=Number(node.dataset.record);app.view='summary';app.screen='record';app.savedNotes=false;app.notesDraft=null;}
          else if(node.dataset.recordTab){app.view=node.dataset.recordTab;}
          else if(node.dataset.category){app.category=node.dataset.category;}
          else if(node.dataset.phase!==undefined){app.negotiationPhase=Number(node.dataset.phase);}
          else if(node.dataset.quote){if(app.active){app.prompt=node.dataset.quote;app.screen='session';}else{requestCopy(app,node.dataset.quote);}}
          else if(node.dataset.action){handle(app,node.dataset.action);}
          renderAll();persist();
          if(node.dataset.action==='copy-text'){const area=app.el.querySelector('[data-copy-text]');if(area){area.focus();area.select();}}
        });
        app.el.addEventListener('submit',event=>{event.preventDefault();if(app.screen==='session')handle(app,'send');else if(app.screen==='import')handle(app,'import-continue');else if(app.screen==='voice')handle(app,'apply-voice');else saveForm(app);renderAll();persist();});
        app.el.addEventListener('keydown',event=>{
          if(event.target.matches('[data-shortcut-capture]')){
            event.preventDefault();if(['Control','Alt','Shift','Meta'].includes(event.key))return;
            const key=event.key===' '?'Space':event.key.length===1?event.key.toUpperCase():event.key;
            app.draft.combo=[event.ctrlKey?'Ctrl':'',event.altKey?'Alt':'',event.shiftKey?'Shift':'',event.metaKey?'Meta':'',key].filter(Boolean).join(' + ');app.dirty=true;event.target.value=app.draft.combo;
          }else if(event.target.matches('[data-prompt]')&&event.ctrlKey&&event.key==='Enter'){event.preventDefault();handle(app,'send');render(app);}
        });
        let captureDrag=null;
        app.el.addEventListener('pointerdown',event=>{
          const surface=event.target.closest('[data-capture-surface]');if(!surface||!app.captureArea)return;
          const bounds=surface.getBoundingClientRect();captureDrag={surface,bounds,x:Math.max(0,Math.min(100,(event.clientX-bounds.left)/bounds.width*100)),y:Math.max(0,Math.min(100,(event.clientY-bounds.top)/bounds.height*100))};surface.setPointerCapture(event.pointerId);event.preventDefault();
        });
        app.el.addEventListener('pointermove',event=>{
          if(!captureDrag)return;const {bounds,x,y}=captureDrag;const right=Math.max(0,Math.min(100,(event.clientX-bounds.left)/bounds.width*100)),bottom=Math.max(0,Math.min(100,(event.clientY-bounds.top)/bounds.height*100));app.selection={left:Math.min(x,right),top:Math.min(y,bottom),width:Math.max(1,Math.abs(right-x)),height:Math.max(1,Math.abs(bottom-y))};const rect=app.el.querySelector('[data-selection]');if(rect)Object.assign(rect.style,{left:app.selection.left+'%',top:app.selection.top+'%',width:app.selection.width+'%',height:app.selection.height+'%'});
        });
        app.el.addEventListener('pointerup',()=>{captureDrag=null;});
        render(app);
        if(globalThis.Tweak){const tweak=new Tweak({container:app.el,onChange:()=>render(app)});tweak.addSlider(app,'radius',{label:'Скругление',min:4,max:20,step:2,unit:'px'});tweak.addSlider(app,'font',{label:'Размер текста',min:13,max:17,unit:'px'});tweak.addSlider(app,'spacing',{label:'Отступы',min:16,max:32,step:2,unit:'px'});tweak.addSelect(app,'theme',{label:'Тема',options:[{label:'Как в чате',value:'system'},{label:'Светлая',value:'light'},{label:'Тёмная',value:'dark'}]});tweak.addColorPicker(app,'accent',{label:'Акцент',reference:'--pk-accent'});tweak.addSelect(app,'audioState',{label:'Состояние звука',options:[{label:'Есть транскрипт',value:'receiving'},{label:'Звук без текста',value:'waiting'},{label:'Нет звука',value:'silent'},{label:'Нет соединения',value:'disconnected'}]});}
      }
      const durationInterval=setInterval(()=>{if(!root.isConnected){clearInterval(durationInterval);return;}for(const app of apps){const timer=app.el.querySelector('[data-elapsed]');if(timer)timer.textContent=formatElapsed(elapsed(app));}},1000);
    })();
  </script>
</div>
