<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pika</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- CSP disabled in HTML: Electron sets its own policy; meta CSP breaks Vite HMR/modules in Electron. -->
</head>

<body style="background-color: transparent; margin: 0; overflow: hidden;">
  <!-- Synchronously apply cached theme before any render — prevents flash/mixed theme -->
  <script>
    try {
      var t = localStorage.getItem('pika_resolved_theme') || localStorage.getItem('natively_resolved_theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
